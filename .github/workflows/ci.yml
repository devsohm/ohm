name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    env:
      OHM_REQUIRE_PROCESS_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [26.7.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure native compiler on Windows
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64
      - name: Build native helper
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: npm run native:build --workspace @ohm/terminal
      - name: Build kernel process launcher
        if: runner.os == 'Windows'
        run: npm run native:build --workspace @ohm/kernel
      - run: npm run check

  macos-check-components:
    timeout-minutes: 30
    env:
      OHM_REQUIRE_PROCESS_TESTS: "1"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run native:build --workspace @ohm/terminal
      - run: npm run check:foundation
      - run: npm run check:static --workspace ohm
      - run: npm run check:post-test --workspace ohm
      - run: npm run check:nonworkspace

  macos-product-tests:
    timeout-minutes: 30
    env:
      OHM_REQUIRE_PROCESS_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run native:build --workspace @ohm/terminal
      - run: npm run build
      - run: npm run test:runner --workspace ohm -- --test-shard=${{ matrix.shard }}/4 "test/**/*.test.ts"

  regression-guards:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage:risk
      - run: npm run benchmark:runtime
